<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D Spiral Cylinder Card Carousel — scroll-driven rotational animation">
    <title>NEXUS — Works Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Grid Background -->
    <div class="grid-bg" id="gridBg"></div>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Vignette -->
    <div class="vignette"></div>



    <!-- 3D Cylinder Scene -->
    <div class="cylinder-viewport" id="cylinderViewport">
        <div class="cylinder-scene" id="cylinderScene">
            <!-- Cards injected by JS -->
        </div>
    </div>

    <!-- Card Info Panel -->
    <div class="card-info" id="cardInfo">
        <div class="card-info-date" id="cardDate"></div>
        <div class="card-info-badge" id="cardBadge"></div>
        <h1 class="card-info-title" id="cardTitle"></h1>
        <p class="card-info-desc" id="cardDesc"></p>
        <div class="card-info-tags" id="cardTags"></div>
    </div>



    <!-- Scroll Progress -->
    <div class="scroll-progress" id="scrollProgress">
        <div class="scroll-progress-track">
            <div class="scroll-progress-fill" id="scrollFill"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
